<h2 class="sr-only">Chapter page with inline lesson and item tree</h2>

<div style="font-size:12px; color:var(--text-muted); margin-bottom:12px;">
  <span style="cursor:pointer;">دوراتي</span>
  <i class="ti ti-chevron-left" style="font-size:13px; vertical-align:-1px;" aria-hidden="true"></i>
  <span style="cursor:pointer;">فيزياء - تالتة ثانوي</span>
  <i class="ti ti-chevron-left" style="font-size:13px; vertical-align:-1px;" aria-hidden="true"></i>
  <span style="color:var(--text-secondary);">الكهربية الساكنة</span>
</div>

<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
  <div style="display:flex; align-items:center; gap:10px;">
    <span style="font-size:18px; font-weight:500; color:var(--text-primary);">الكهربية الساكنة</span>
    <span style="font-size:12px; color:var(--text-muted);">الفصل 1 · درسان · 4 عناصر</span>
  </div>
  <span style="font-size:12.5px; color:var(--text-secondary); border:0.5px solid var(--border-strong); border-radius:var(--radius); padding:5px 12px; cursor:pointer;">
    <i class="ti ti-pencil" aria-hidden="true"></i> تعديل الفصل
  </span>
</div>

<div style="display:flex; flex-direction:column; gap:10px;">

  <div style="background:var(--surface-2); border:0.5px solid var(--border); border-radius:12px; overflow:hidden;">
    <div style="display:flex; align-items:center; gap:10px; padding:13px 14px; background:var(--surface-1);">
      <i class="ti ti-grip-vertical" style="color:var(--text-muted); font-size:16px; cursor:grab;" aria-hidden="true"></i>
      <i class="ti ti-chevron-down" style="color:var(--text-secondary); font-size:18px;" aria-hidden="true"></i>
      <span style="font-weight:500; font-size:14px; color:var(--text-primary);">قانون كولوم</span>
      <span style="font-size:11px; color:var(--text-muted);">3 عناصر</span>
      <span style="margin-inline-start:auto;"></span>
      <i class="ti ti-dots" style="color:var(--text-muted); font-size:18px;" aria-hidden="true"></i>
    </div>
    <div style="border-inline-start:2px solid var(--border); margin-inline-start:26px; padding:2px 0 4px;">
      <div style="display:flex; align-items:center; gap:10px; padding:9px 14px;">
        <i class="ti ti-grip-vertical" style="color:var(--text-muted); font-size:14px; opacity:0.4;" aria-hidden="true"></i>
        <span style="width:22px; height:22px; border-radius:6px; background:var(--bg-accent); display:inline-flex; align-items:center; justify-content:center;"><i class="ti ti-player-play" style="color:var(--text-accent); font-size:13px;" aria-hidden="true"></i></span>
        <span style="font-size:13px; color:var(--text-primary);">فيديو الشرح</span>
        <span style="margin-inline-start:auto;"></span>
        <span style="font-size:11px; color:var(--text-success); background:var(--bg-success); padding:2px 8px; border-radius:999px;">جاهز</span>
      </div>
      <div style="display:flex; align-items:center; gap:10px; padding:9px 14px;">
        <i class="ti ti-grip-vertical" style="color:var(--text-muted); font-size:14px; opacity:0.4;" aria-hidden="true"></i>
        <span style="width:22px; height:22px; border-radius:6px; background:var(--bg-warning); display:inline-flex; align-items:center; justify-content:center;"><i class="ti ti-file-text" style="color:var(--text-warning); font-size:13px;" aria-hidden="true"></i></span>
        <span style="font-size:13px; color:var(--text-primary);">ملخص PDF</span>
        <span style="margin-inline-start:auto;"></span>
        <span style="font-size:11px; color:var(--text-success); background:var(--bg-success); padding:2px 8px; border-radius:999px;">جاهز</span>
      </div>
      <div style="display:flex; align-items:center; gap:10px; padding:9px 14px;">
        <i class="ti ti-grip-vertical" style="color:var(--text-muted); font-size:14px; opacity:0.4;" aria-hidden="true"></i>
        <span style="width:22px; height:22px; border-radius:6px; background:var(--bg-pro); display:inline-flex; align-items:center; justify-content:center;"><i class="ti ti-help-circle" style="color:var(--text-pro); font-size:13px;" aria-hidden="true"></i></span>
        <span style="font-size:13px; color:var(--text-primary);">امتحان قصير</span>
        <span style="margin-inline-start:auto;"></span>
        <span style="font-size:11px; color:var(--text-secondary); background:var(--surface-1); padding:2px 8px; border-radius:999px;">3 أسئلة</span>
      </div>
      <div style="padding:7px 14px;">
        <span style="font-size:12px; color:var(--text-muted); cursor:pointer;"><i class="ti ti-plus" aria-hidden="true"></i> إضافة عنصر</span>
      </div>
    </div>
  </div>

  <div style="background:var(--surface-2); border:0.5px solid var(--border); border-radius:12px; overflow:hidden;">
    <div style="display:flex; align-items:center; gap:10px; padding:13px 14px; background:var(--surface-1);">
      <i class="ti ti-grip-vertical" style="color:var(--text-muted); font-size:16px; cursor:grab;" aria-hidden="true"></i>
      <i class="ti ti-chevron-left" style="color:var(--text-secondary); font-size:18px;" aria-hidden="true"></i>
      <span style="font-weight:500; font-size:14px; color:var(--text-primary);">المجال الكهربي</span>
      <span style="font-size:11px; color:var(--text-muted);">عنصر واحد</span>
      <span style="margin-inline-start:auto;"></span>
      <span style="font-size:11px; color:var(--text-warning); background:var(--bg-warning); padding:2px 8px; border-radius:999px;"><i class="ti ti-loader" aria-hidden="true"></i> بيتحول</span>
      <i class="ti ti-dots" style="color:var(--text-muted); font-size:18px;" aria-hidden="true"></i>
    </div>
  </div>

  <div style="padding:4px 2px;">
    <span style="font-size:13px; color:var(--text-accent); cursor:pointer; font-weight:500;"><i class="ti ti-plus" aria-hidden="true"></i> درس جديد</span>
  </div>

</div>
</div></body></html>
